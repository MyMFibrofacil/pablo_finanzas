<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carga remota | Pablo Finanzas</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <section class="card">
      <div class="copy">
        <span class="kicker">Pablo Finanzas</span>
        <h1>Carga remota</h1>
        <p>Cargá un gasto o una cuota desde el celular y se importa en la próxima sincronización.</p>
      </div>

      <form id="remoteEntryForm" class="form">
        <input type="hidden" name="action" value="create_entry">

        <label>PIN
          <input name="pin" type="password" inputmode="numeric" required>
        </label>

        <label>Tipo
          <select name="tipo_registro" id="tipoRegistro" required>
            <option value="gasto">Gasto</option>
            <option value="cuota">Cuota</option>
          </select>
        </label>

        <label>Fecha
          <input name="fecha" type="date" required>
        </label>

        <label>Concepto
          <input name="concepto" type="text" required>
        </label>

        <label>Categoria
          <input name="categoria" type="text">
        </label>

        <label>Monto
          <input name="monto" type="number" step="0.01" min="0.01" required>
        </label>

        <div id="gastoFields" class="group">
          <label>Tipo de gasto
            <select name="tx_type">
              <option value="fixed_expense">Gasto fijo</option>
              <option value="cash_withdrawal">Efectivo</option>
              <option value="adjustment">Ajuste</option>
            </select>
          </label>
        </div>

        <div id="cuotaFields" class="group hidden">
          <label>Cantidad de cuotas
            <input name="installments" type="number" min="1" value="1">
          </label>

          <label>Mes de inicio
            <input name="start_month" type="month">
          </label>
        </div>

        <label>Notas
          <textarea name="notes" rows="3"></textarea>
        </label>

        <button type="submit">Guardar</button>
        <div id="statusBox" class="status hidden"></div>
      </form>

      <iframe name="remoteSubmitFrame" id="remoteSubmitFrame" class="hidden"></iframe>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
